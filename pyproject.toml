[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-weft"
version = "0.1.0"
description = "Turns Extreme Fabric Engine / VOSS show-command output into typed Python records"
readme = "README.md"
# The work server runs 3.11; 3.10 is the floor so the Mac and older tools can use it too.
requires-python = ">=3.10"
dependencies = []  # standard library only, see docs/decisions/0002

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.10"]
capture = ["netmiko>=4"]  # only for tools/capture.py, never imported by the library

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fabric_weft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# strict on the library: it is imported by other tools and ships py.typed (decision 0015)
files = ["src", "tests"]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PIE", "RET", "PT"]
ignore = [
    "PLR2004",  # magic values: column counts and VLAN limits read better inline
    "PLR0913",  # dataclass-like constructors take many arguments by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # captured switch output is wider than 100 columns

[tool.ruff.format]
quote-style = "double"
exclude = ["*.md"]  # keep hand-aligned examples in the docs
